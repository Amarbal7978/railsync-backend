<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailSync AI - Forgot Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #100b25;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 490px;
      padding: 35px;
      border: 1px solid #7651d8;
      border-radius: 16px;
      background: #1b1238;
    }

    h1 {
      text-align: center;
      color: #b9a0ff;
    }

    p {
      text-align: center;
      color: #c4b9e8;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #7651d8;
      background: #100b25;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(90deg, #8438ed, #4d45e8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #b9a0ff;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      color: #b9ffca;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>RailSync AI</h1>
    <p>Reset your account password</p>

    <form id="forgotForm">
      <label for="email">Registered Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        required
      >

      <button type="submit">Send OTP</button>
    </form>

    <form id="resetForm" style="display: none;">
      <label for="otp">Enter OTP</label>
      <input
        type="text"
        id="otp"
        placeholder="Enter email OTP"
        required
      >

      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        required
      >

      <button type="submit">Reset Password</button>
    </form>

    <div id="message"></div>

    <a href="/">← Back to Login</a>
  </div>

  <script>
    const API_URL = "/api/apps/railsync";
    const forgotForm = document.getElementById("forgotForm");
    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");

    forgotForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      message.textContent = "Sending OTP...";

      try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Unable to send OTP");
        }

        message.textContent = data.message || "OTP sent to your email.";
        forgotForm.style.display = "none";
        resetForm.style.display = "block";
      } catch (error) {
        message.textContent = error.message;
      }
    });

    resetForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();
      const newPassword = document.getElementById("newPassword").value;

      message.textContent = "Resetting password...";

      try {
        const response = await fetch(`${API_URL}/auth/reset-password`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            otp,
            newPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Password reset failed");
        }

        message.textContent = "Password reset successful. You can now login.";
        resetForm.style.display = "none";
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
