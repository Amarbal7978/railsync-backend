<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailSync AI | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #31206b, transparent 40%),
        linear-gradient(135deg, #080516, #17102e, #090b20);
      color: white;
    }

    .login-card {
      width: 90%;
      max-width: 430px;
      padding: 38px;
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 22px;
      background: rgba(25, 18, 55, 0.9);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      color: #c4b5fd;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b8b2d1;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #e9e5ff;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #51447c;
      border-radius: 10px;
      outline: none;
      background: #100c25;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #a78bfa;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      min-height: 22px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #9289b5;
      font-size: 11px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">🚆</div>

    <h1>RailSync AI</h1>

    <p class="subtitle">
      Railway Operations Intelligence Platform
    </p>

    <form id="loginForm">
      <label for="email">Employee Email</label>

      <input
        type="email"
        id="email"
        placeholder="admin@railsync.ai"
        required
      />

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      />

      <button type="submit">Secure Login</button>
    </form>

    <div id="message"></div>

    <div class="footer">
      Authorized Railway Personnel Only<br />
      AI Decision Support System<br />
      SIMULATED DEMO DATA — NOT LIVE INDIAN RAILWAYS DATA
    </div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.style.color = "#c4b5fd";
      message.textContent = "Authenticating...";

      try {
        const response = await fetch(
          "/api/apps/railsync/auth/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );
        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message || "Invalid email or password"
          );
        }

        if (data.token) {
          localStorage.setItem("railsync_token", data.token);
        }

        message.style.color = "#86efac";
        message.textContent = "Login successful!";

        setTimeout(function () {
          window.location.href = "https://rail-sync-ai-prototype.base44.app";
        }, 1000);

      } catch (error) {
        message.style.color = "#fca5a5";
        message.textContent =
          error.message || "Network error";
      }
    });
  </script>
</body>
</html>
