<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailSync AI | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #31206b, transparent 40%),
        linear-gradient(135deg, #080516, #17102e, #090b20);
      color: white;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px;
      border: 1px solid rgba(167, 139, 250, 0.3);
      border-radius: 22px;
      background: rgba(25, 18, 55, 0.9);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      color: #c4b5fd;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #b8b2d1;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #e9e5ff;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #51447c;
      border-radius: 10px;
      outline: none;
      background: #100c25;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #a78bfa;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .switch-button {
      background: transparent;
      border: 1px solid #7c3aed;
      margin-top: 12px;
    }

    #message {
      min-height: 22px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #9289b5;
      font-size: 11px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">🚆</div>

    <h1>RailSync AI</h1>

    <p class="subtitle">
      Railway Operations Intelligence Platform
    </p>

    <!-- Login Form -->
    <form id="loginForm">
      <label for="loginEmail">Employee Email</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        required
      />

      <label for="loginPassword">Password</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
        required
      />

      <button type="submit">Secure Login</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      />

      <label for="registerEmail">Email</label>
      <input
        type="email"
        id="registerEmail"
        placeholder="Enter your email"
        required
      />

      <label for="registerPassword">Password</label>
      <input
        type="password"
        id="registerPassword"
        placeholder="Create a password"
        required
      />

      <button type="submit">Create Account</button>
    </form>

    <button id="switchButton" class="switch-button">
      New user? Register here
    </button>

    <div id="message"></div>

    <div class="footer">
      Authorized Railway Personnel Only<br />
      AI Decision Support System<br />
      SIMULATED DEMO DATA — NOT LIVE INDIAN RAILWAYS DATA
    </div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const switchButton = document.getElementById("switchButton");
    const message = document.getElementById("message");

    let registerMode = false;

    function showMessage(text, color) {
      message.style.color = color;
      message.textContent = text;
    }

    function saveToken(data) {
      const token = data.access_token || data.token;

      if (token) {
        localStorage.setItem("railsync_token", token);
      }
    }

    switchButton.addEventListener("click", function () {
      registerMode = !registerMode;
      message.textContent = "";

      if (registerMode) {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        switchButton.textContent = "Already registered? Login here";
      } else {
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        switchButton.textContent = "New user? Register here";
      }
    });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      showMessage("Authenticating...", "#c4b5fd");

      try {
        const response = await fetch("/api/apps/railsync/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Invalid email or password");
        }

        saveToken(data);
        showMessage("Login successful!", "#86efac");

        setTimeout(function () {
          window.location.href =
            "https://rail-sync-ai-prototype.base44.app";
        }, 1000);

      } catch (error) {
        showMessage(error.message || "Network error", "#fca5a5");
      }
    });

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value;

      showMessage("Creating account...", "#c4b5fd");

      try {
        const response = await fetch("/api/apps/railsync/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            email,
            password,
            department: "Operations",
            role: "Section Controller"
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Registration failed");
        }

        showMessage("Account created successfully! Ab login karein.", "#86efac");

registerForm.reset();
registerForm.style.display = "none";
loginForm.style.display = "block";
        showMessage("Account created successfully!", "#86efac");

        setTimeout(function () {
          window.location.href =
            "https://rail-sync-ai-prototype.base44.app";
        }, 1000);

      } catch (error) {
        showMessage(error.message || "Registration error", "#fca5a5");
      }
    });
  </script>
</body>
</html>
